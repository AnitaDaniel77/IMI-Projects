# Shared settings for every environment
spring.application.name=bookstore

# Pick the environment: dev or prod
spring.profiles.active=dev

# Read credentials from environment variables, never type them here
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Run schema.sql and data.sql on startup (needed for MySQL)
spring.sql.init.mode=always

# Health check endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Keep logs quiet enough not to leak details
logging.level.root=INFO