<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Account Summary</title>
</head>
<body>
  <!-- Page for lesson 3: shows a paragraph, a list and a table -->

  <!-- Heading for the page -->
  <h1>Account Summary</h1>

  <!-- Paragraph tag for normal text -->
  <p>Here is a quick look at this month's account.</p>

  <!-- List tag for the fees -->
  <ul>
    <li>Monthly fee</li>
    <li>ATM withdrawal fee</li>
    <li>SMS notification fee</li>
  </ul>

  <!-- Table tag for the transactions -->
  <table border="1">
    <tr>
      <th>Date</th>
      <th>Description</th>
      <th>Amount</th>
    </tr>
    <tr>
      <td>2026-10-01</td>
      <td>Groceries</td>
      <td>R450</td>
    </tr>
    <tr>
      <td>2026-10-03</td>
      <td>Airtime</td>
      <td>R100</td>
    </tr>
  </table>
</body>
</html>
