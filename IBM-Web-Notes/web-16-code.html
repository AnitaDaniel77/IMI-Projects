<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fieldset and Legend Demo</title>
</head>
<body>
    <h1>Open an Account</h1>

    <form>
        <!-- group 1: who you are -->
        <fieldset name="personal_details">
            <legend>Personal Details</legend>

            <label for="fname">First name:</label>
            <input type="text" id="fname" name="fname"><br>

            <label for="lname">Last name:</label>
            <input type="text" id="lname" name="lname"><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"><br>
        </fieldset>

        <br>

        <!-- group 2: work info -->
        <fieldset name="professional_details">
            <legend>Professional Details</legend>

            <label for="occupation">Occupation:</label>
            <input type="text" id="occupation" name="occupation"><br>

            <label for="company">Company:</label>
            <input type="text" id="company" name="company"><br>

            <label for="start">Start Date:</label>
            <input type="date" id="start" name="start"><br>

            <label for="end">End Date:</label>
            <input type="date" id="end" name="end"><br>
        </fieldset>

        <br>

        <!-- disabled switches off everything inside -->
        <fieldset name="office_use" disabled>
            <legend>For Bank Use Only</legend>

            <label for="ref">Reference number:</label>
            <input type="text" id="ref" name="ref"><br>
        </fieldset>

        <br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
