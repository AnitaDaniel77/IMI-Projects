<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vanilla CSS and Bootstrap Demo</title>

    <!-- bootstrap from a CDN, needs internet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- our own vanilla CSS -->
    <link rel="stylesheet" href="web-19-code.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Danger Link, Two Ways</h1>

        <h2>Vanilla CSS</h2>
        <!-- styled by our own rules in web-19-code.css -->
        <p><a href="#" class="danger-link">Report fraud</a></p>

        <h2>Bootstrap</h2>
        <!-- one ready-made class does it all -->
        <p><a href="#" class="link-danger">Report fraud</a></p>

        <h2>More Bootstrap components</h2>
        <button type="button" class="btn btn-primary">Pay now</button>
        <div class="alert alert-danger mt-3" role="alert">
            Suspicious activity found on your card.
        </div>
    </div>
</body>
</html>
